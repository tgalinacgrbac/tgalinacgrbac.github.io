  <title id="title">Research Alignment Workshop II</title>
  <desc id="desc">Hybrid Research Alignment Workshop II, co-located with SoftCOM 2026 in Split, Croatia, on Friday, 18 September 2026, from 14:30 to 16:00. The in-person workshop takes place in the Agava Room at the Radisson Blu Hotel, with online participation available.</desc>
