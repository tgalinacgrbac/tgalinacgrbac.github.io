    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="420" fill="url(#bg)"/>
  <circle cx="1180" cy="80" r="220" fill="#3a86ff" opacity="0.16"/>
  <circle cx="180" cy="360" r="180" fill="#4cc9f0" opacity="0.18"/>
  <rect x="80" y="70" width="1240" height="280" rx="24" fill="#ffffff" opacity="0.10"/>

  <text x="130" y="170" font-family="Georgia, Times New Roman, serif" font-size="52" fill="#ffffff" font-weight="700">
